name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build-linux:
    name: Build release binaries on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        # Pinned: the compiled binaries embed this Bun runtime, so the release
        # must ship the version the test suite ran against, not "latest".
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify tag matches package version
        run: |
          VERSION="$(bun -e 'const pkg = await Bun.file("package.json").json(); process.stdout.write(pkg.version)')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --os='*' --cpu='*'

      - name: Verify cross-platform native dependencies
        # OpenTUI resolves `@opentui/core-<platform>-<arch>` through a dynamic
        # import that bun build embeds per target. If a target's package is
        # missing, the binary still passes `--version` but crashes on the TUI,
        # so fail here instead of publishing a broken release.
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            if [ ! -f "node_modules/@opentui/core-$target/package.json" ]; then
              echo "missing @opentui/core-$target; cannot build a working $target binary" >&2
              exit 1
            fi
          done

      - name: Build release binaries
        run: bun run build:release

      - name: Smoke-test Linux binary
        run: ./dist/convoy-linux-x64 --version

      - name: Stage the installer
        # install.sh is published per release so `curl … | sh` resolves to the
        # script that was tested against these exact binaries, and so a pinned
        # `/releases/download/<tag>/install.sh` stays reproducible.
        run: |
          sh -n install.sh
          cp install.sh dist/install.sh

      - name: Upload release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            dist/convoy-*
            dist/install.sh
          if-no-files-found: error

  smoke-darwin:
    name: Smoke-test release binaries on Darwin ARM64
    runs-on: macos-14
    permissions:
      contents: read

    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        # Keep this pin aligned with verification because compiled binaries embed it.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --os='*' --cpu='*'

      - name: Verify cross-platform native dependencies
        run: |
          for target in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            if [ ! -f "node_modules/@opentui/core-$target/package.json" ]; then
              echo "missing @opentui/core-$target; cannot build a working $target binary" >&2
              exit 1
            fi
          done

      - name: Build release binaries
        run: bun run build:release

      - name: Smoke-test Darwin ARM64 binary
        # darwin-x64 and linux-arm64 remain cross-target-only: their native
        # runners are not part of this release workflow.
        run: ./dist/convoy-darwin-arm64 --version

  publish:
    name: Publish GitHub Release
    needs: [verify, build-linux, smoke-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 convoy-darwin-arm64 convoy-darwin-x64 convoy-linux-arm64 convoy-linux-x64 install.sh > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/convoy-darwin-arm64
            dist/convoy-darwin-x64
            dist/convoy-linux-arm64
            dist/convoy-linux-x64
            dist/install.sh
            dist/SHA256SUMS
