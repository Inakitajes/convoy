    <rect x="405" y="134" width="30" height="32"/>
    <rect x="315" y="166" width="120" height="32"/>
    <!-- N -->
    <rect x="465" y="102" width="30" height="32"/>
    <rect x="555" y="102" width="30" height="32"/>
    <rect x="465" y="134" width="60" height="32"/>
    <rect x="555" y="134" width="30" height="32"/>
    <rect x="465" y="166" width="30" height="32"/>
    <rect x="525" y="166" width="60" height="32"/>
