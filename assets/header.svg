<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title description">
  <title id="title">Convoy — from intent to ship</title>
  <desc id="description">The blue block-letter Convoy wordmark from the terminal Home, on a dark navy background.</desc>
